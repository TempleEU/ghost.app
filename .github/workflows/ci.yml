name: Build Test Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ghostly_tag:
        description: "Tag to create & release on TempleEU/Ghostly.android (blank = auto vYYYY.MM.DD.HHMM)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publish:
    if: github.event_name != 'pull_request'
    needs: build-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dispatch-ghostly-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Tag Ghostly.main and dispatch release
        env:
          GH_PAT: ${{ secrets.ANDROID_DISPATCH_PAT }}
          TAG_INPUT: ${{ inputs.ghostly_tag }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          REPO="TempleEU/Ghostly.android"
          AUTH="Authorization: Bearer $GH_PAT"
          TAG="${TAG_INPUT:-v$(date -u +%Y.%m.%d.%H%M)}"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          SHA="$(curl -sf -H "$AUTH" "$API/repos/$REPO/branches/Ghostly.main" | jq -r .commit.sha)"
          HTTP=$(curl -s -o ref_out.json -w "%{http_code}" -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/repos/$REPO/git/refs" -d "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$SHA\"}")
          if [ "$HTTP" != "201" ]; then cat ref_out.json; exit 1; fi
          HTTP=$(curl -s -o disp_out.json -w "%{http_code}" -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/repos/$REPO/dispatches" -d "{\"event_type\":\"ghostly-release\",\"client_payload\":{\"version\":\"$TAG\"}}")
          if [ "$HTTP" != "204" ]; then cat disp_out.json; exit 1; fi
